<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LoopyGo | Mercado Autônomo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <div class="header-container">

            <!-- LOGO -->
            <a href="#inicio" class="logo">
                <!--
                    INSIRA SEU LOGO AQUI

                    Exemplo:
                    <img src="img/logo.png" alt="LoopyGo">
                -->

                <span>LOGO</span>
            </a>


            <!-- MENU -->
            <nav class="nav">

                <a href="#inicio" class="nav-link">
                    Início
                </a>

                <a href="#servicos" class="nav-link">
                    Serviços
                </a>

                <a href="#como-funciona" class="nav-link">
                    Como Funciona?
                </a>

                <a href="#contato" class="nav-link">
                    Contato
                </a>

            </nav>


            <!-- BOTÃO HEADER -->
            <a href="#contato" class="btn-proposta">
                Solicitar Proposta
            </a>

        </div>

    </header>


    <!-- =========================
         HERO / INÍCIO
    ========================== -->

    <main>

        <section class="hero" id="inicio">

            <!--
                IMAGEM DE FUNDO

                A imagem será colocada pelo CSS através de:
                background-image

                Depois podemos substituir pelo caminho
                da sua imagem.
            -->

            <div class="hero-overlay"></div>


            <!-- CONTEÚDO DO HERO -->

            <div class="hero-container">

                <div class="hero-content">

                    <h1>
                        O mercado do
                        <span>futuro</span> dentro do
                        seu condomínio.
                    </h1>


                    <p>
                        Mini mercados autônomos, inteligentes
                        e 24 horas para a comodidade dos
                        moradores do seu condomínio.
                    </p>


                    <!-- BOTÕES -->

                    <div class="hero-buttons">

                        <a href="#servicos" class="btn-primary">
                            Conheça LoopyGo
                            <span class="arrow">→</span>
                        </a>


                        <a href="#" class="btn-download">

                            <span class="download-icon">
                                ↓
                            </span>

                            Baixar Apresentação

                        </a>

                    </div>

                </div>

            </div>

        </section>


        <!-- =========================
             ESPAÇO PARA AS PRÓXIMAS SECTIONS
        ========================== -->

        <section id="servicos" class="placeholder-section">
            <h2>Serviços</h2>
        </section>


        <section id="como-funciona" class="placeholder-section">
            <h2>Como Funciona?</h2>
        </section>


        <section id="contato" class="placeholder-section">
            <h2>Contato</h2>
        </section>

    </main>

</body>
</html>
